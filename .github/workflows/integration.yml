name: Integration checks
on:
  push:
    branches: [main, frontend, final, 'integrate/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vision:
    name: Dashboard, exterior, and vision API contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt cryptography
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests_exterior -v
  frontend:
    name: Frontend and shared map contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
  mobile:
    name: Existing mobile app lint and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ToyotaUTD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ToyotaUTD/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
  backend:
    name: Existing SpacetimeDB module types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: db/spacetime-backend/spacetimedb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: db/spacetime-backend/spacetimedb/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
  partner-database:
    name: Partner map database types and reducer contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ToyotaUTD/spacetime-chat/spacetimedb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ToyotaUTD/spacetime-chat/spacetimedb/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx --no-install tsc --noEmit
      - run: npm test
